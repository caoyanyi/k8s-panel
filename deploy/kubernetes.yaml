apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-panel-config
  namespace: k8s-panel
data:
  listen-address: "0.0.0.0:8080"
  allowed-private-cidrs: "10.0.0.0/8"
  operation-workers: "2"
  operation-queue-size: "64"
  adaptive-operations: "true"
  kubernetes-read-concurrency: "4"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-panel-data
  namespace: k8s-panel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-panel
  namespace: k8s-panel
  labels:
    app.kubernetes.io/name: k8s-panel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-panel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: ghcr.io/caoyanyi/k8s-panel:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PANEL_LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: k8s-panel-config
                  key: listen-address
            - name: PANEL_DATA_FILE
              value: /data/panel.json
            - name: PANEL_WEB_DIR
              value: /app/web
            - name: PANEL_ALLOWED_PRIVATE_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: k8s-panel-config
                  key: allowed-private-cidrs
            - name: PANEL_HELM_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: k8s-panel-config
                  key: operation-workers
            - name: PANEL_OPERATION_QUEUE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: k8s-panel-config
                  key: operation-queue-size
            - name: PANEL_ADAPTIVE_OPERATIONS
              valueFrom:
                configMapKeyRef:
                  name: k8s-panel-config
                  key: adaptive-operations
            - name: PANEL_KUBERNETES_READ_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: k8s-panel-config
                  key: kubernetes-read-concurrency
            - name: PANEL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-panel-secrets
                  key: encryption-key
            - name: PANEL_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: k8s-panel-secrets
                  key: admin-password-hash
            - name: PANEL_SECURE_COOKIES
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8s-panel-data
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-panel
  namespace: k8s-panel
  labels:
    app.kubernetes.io/name: k8s-panel
spec:
  selector:
    app.kubernetes.io/name: k8s-panel
  ports:
    - name: http
      port: 80
      targetPort: http
