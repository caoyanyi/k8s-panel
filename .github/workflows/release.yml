name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: release
        name: Validate SemVer and source commit
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $pattern ]]; then
            echo "Invalid release tag: $tag" >&2
            echo "Expected vMAJOR.MINOR.PATCH or a SemVer prerelease tag." >&2
            exit 1
          fi

          version="${tag#v}"
          version_without_build="${version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            prerelease="${version_without_build#*-}"
            IFS='.' read -ra identifiers <<<"$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                echo "Invalid numeric prerelease identifier: $identifier" >&2
                exit 1
              fi
            done
            is_prerelease=true
          else
            is_prerelease=false
          fi

          commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Test Go
        run: GOMAXPROCS=2 go test -p=2 -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Verify Go modules
        run: go mod verify
      - name: Audit web dependencies
        run: npm audit --prefix web --audit-level=high
      - name: Test web
        run: npm test --prefix web
      - name: Type-check web
        run: npm run typecheck --prefix web
      - name: Build web
        run: npm run build --prefix web

  assets:
    name: Package release assets
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Build release archives
        run: scripts/package-release.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.commit }}"
      - name: Verify packaged versions
        run: |
          tar -xOf "dist/k8s-panel_${{ needs.prepare.outputs.version }}_linux_amd64.tar.gz" \
            "k8s-panel_${{ needs.prepare.outputs.version }}_linux_amd64/panel" > /tmp/panel
          chmod +x /tmp/panel
          /tmp/panel --version
          /tmp/panel --version | grep -F "${{ needs.prepare.outputs.version }}"
          (cd dist && sha256sum --check checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  image:
    name: Publish multi-platform image
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Generate image metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub release
    needs: [prepare, assets, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --generate-notes
            --title "$GITHUB_REF_NAME"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" dist/*
